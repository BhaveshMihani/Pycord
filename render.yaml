services:
  # Backend Web Service (FastAPI)
  - type: web
    name: pycord-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: pycord
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: SKIP_WEBHOOK_VERIFICATION
        value: "true"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: pycord-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend Static Site (React/Vite)
  - type: web
    name: pycord-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pycord-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
